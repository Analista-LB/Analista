<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111e">
  <meta name="description" content="Accesos de trabajo de Analista Grupo LuanBeer, organizados en un solo lugar.">
  <title>Analista Grupo LuanBeer · Panel de accesos</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <script src="links.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div class="page-shell">
    <header class="masthead">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" focusable="false"><path d="M27 4 10 26h12l-2 18 18-25H25L27 4Z"/></svg>
      </div>
      <p class="eyebrow">PANEL DE ACCESOS</p>
      <h1 id="site-title">Analista Grupo LuanBeer</h1>
      <p class="intro" id="site-description">Todos los accesos importantes de trabajo, organizados en un solo lugar.</p>
    </header>

    <main class="workspace">
      <div class="toolbar">
        <label class="search-field" for="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.7" cy="10.7" r="6.6"/><path d="m16 16 5 5"/></svg>
          <span class="visually-hidden">Buscar acceso</span>
          <input id="search" type="search" placeholder="Buscar acceso..." autocomplete="off" spellcheck="false">
        </label>
        <p id="counter" class="visually-hidden" role="status" aria-live="polite">5 accesos disponibles</p>
      </div>
      <div id="categories" class="categories" aria-label="Accesos por categoría"></div>
      <p id="empty" class="empty-state" hidden>No encontré accesos que coincidan con la búsqueda.</p>
    </main>

    <footer><span class="footer-rule" aria-hidden="true"></span><span id="footer-label">Analista Grupo LuanBeer</span> <span aria-hidden="true">•</span> <span id="year"></span></footer>
  </div>
</body>
</html>
